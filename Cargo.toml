[package]
name = "entros-mopro"
version = "0.1.0"
edition = "2021"
description = "Mobile Groth16 prover for the Entros Protocol Hamming-distance circuit. Wraps mopro to produce React Native UniFFI bindings that prove Hamming(fingerprint_new, fingerprint_baseline) < threshold on-device."
license = "MIT"
repository = "https://github.com/entros-protocol/entros-mopro"
documentation = "https://github.com/entros-protocol/entros-mopro#readme"
readme = "README.md"
keywords = ["zk", "groth16", "circom", "solana", "react-native"]
categories = ["cryptography", "wasm", "api-bindings"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["uniffi"]
uniffi = ["mopro-ffi/uniffi"]
flutter = ["mopro-ffi/flutter"]
wasm = ["mopro-ffi/wasm"]

[dependencies]
mopro-ffi = { version = "0.3.4" }
thiserror = "2.0.12"
anyhow = "1.0.99"
circom-prover = "0.1"
rust-witness = "0.1"
num-bigint = "0.4.0"

[build-dependencies]
witnesscalc-adapter = "0.1"
rust-witness = "0.1"

[dev-dependencies]
mopro-ffi = { version = "0.3.4", features = ["uniffi-tests"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.94"

[target.wasm32-unknown-unknown.dependencies]
mopro-ffi = { version = "0.3.4", features = ["wasm"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
